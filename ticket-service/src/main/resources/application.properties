spring.application.name=ticket-service
server.port=8080
management.endpoints.web.exposure.include=health,info

# Database: connection comes from the active profile (dev) or from env vars
# (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD).
# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.web.pageable.max-page-size=100

# JWT: the secret comes from the active profile or from APP_JWT_SECRET (base64, at least 32 bytes).
app.jwt.issuer=supportpilot-ticket-service
app.jwt.expiration=PT1H
